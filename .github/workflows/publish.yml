name: Publish academic website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check local links
        run: |
          python - <<'PYTHON'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          class PageLinks(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.references = []
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.add(attrs['id'])
                  self.references.extend(attrs[k] for k in ('href', 'src') if attrs.get(k))
          page = PageLinks()
          page.feed(Path('index.html').read_text())
          for reference in page.references:
              parsed = urlsplit(reference)
              if parsed.scheme or parsed.netloc:
                  continue
              if parsed.path:
                  assert Path(unquote(parsed.path).lstrip('/')).is_file(), reference
              elif parsed.fragment:
                  assert unquote(parsed.fragment) in page.ids, reference
          print('All local links and section anchors exist.')
          PYTHON
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R wp-content _site/
          # Machine-readable layer (see scripts/build_llm_text.py)
          cp llms.txt llms-full.txt cv.md sitemap.xml robots.txt _site/
          cp -R research _site/
          [ -f CNAME ] && cp CNAME _site/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
